spring.application.name=springboot-devops-app

# Version shown by /api/version - Opsera/Docker passes APP_VERSION (image tag) at runtime
app.version=${APP_VERSION:local}

# Actuator: expose health + info only, with Kubernetes liveness/readiness groups
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Finish in-flight requests before the pod stops (zero-downtime rollouts)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-devops-app
  labels:
    app: springboot-devops-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: springboot-devops-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # never drop below 2 serving pods during a rollout
  template:
    metadata:
      labels:
        app: springboot-devops-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: app
          # Opsera's Argo CD step / kustomization.yaml swaps this for the ECR image + build tag
          image: springboot-devops-app:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "latest"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24     # up to 2 min for JVM start
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
